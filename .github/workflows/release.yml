name: Release

# Publishing is deliberately manual: bump the version in Cargo.toml, move the
# CHANGELOG heading, tag, push. The workflow only carries out the upload, and
# only for a tag, so nothing reaches crates.io by accident.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    # Required for the OIDC exchange below; nothing else needs elevated rights.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The fixture is generated, not committed, so regenerate before testing.
      - name: Generate the test fixture
        run: python3 tests/fixtures/make_sample_pptx.py tests/fixtures/sample.pptx

      # A tag that does not pass the same suite CI runs must not publish.
      - name: Test
        run: cargo test --all-targets
      - name: Package (verifies the .crate builds on its own)
        run: cargo package --locked

      # Authentication happens only after the package is verified, and the
      # short-lived token exists just for this job: trusted publishing swaps
      # GitHub's OIDC identity for a crates.io token that is revoked when the
      # job ends. No long-lived secret is stored in the repository.
      #
      # Trusted publishing can only be configured once the crate exists, so
      # the very first release still needs CARGO_REGISTRY_TOKEN. This step
      # tolerates that: if no trusted publisher is configured yet it fails
      # quietly and the publish below falls back to the secret.
      - name: Authenticate (trusted publishing, if configured)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
