[package]
name = "deckr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["yuewang2026"]
description = "A bidirectional PowerPoint engine: read .pptx into a semantic Deck IR, emit Markdown or JSON, and build it back."
license = "MIT"
readme = "README.md"
repository = "https://github.com/yuewang2026/deckr-pptx-oxide"
homepage = "https://github.com/yuewang2026/deckr-pptx-oxide"
documentation = "https://docs.rs/deckr"
keywords = ["pptx", "powerpoint", "ooxml", "presentation", "document"]
categories = ["command-line-utilities", "parser-implementations", "text-processing"]
# The published .crate carries what a consumer needs to build, test and audit
# deckr — sources, tests, the design notes — and nothing else. Build output and
# CI configuration stay out; the generated fixture is gitignored anyway, since
# every test regenerates it from `make_sample_pptx.py`.
include = [
    "src/**/*",
    "tests/*.rs",
    "tests/fixtures/*.py",
    "examples/**/*",
    "docs/**/*",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
]

[dependencies]
# `default-features = false` drops clap's `color` support, which is what drags
# anstream -> anstyle-wincon -> windows-sys into the graph on Windows.
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
# Office packages use ZIP Deflate or Stored; we deliberately do not pull in
# aes/bzip2/lzma/zstd support, which would drag ~25 transitive crates along.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Pictures carry their bytes; JSON keeps them portable without inventing a
# sidecar-file convention by base64-encoding in place.
base64 = "0.22"
# The `render --png` path rasterises the SVG preview into real bitmaps with
# `resvg`, a pure-Rust SVG renderer (no Cairo/HarfBuzz/system fontconfig on
# Windows), so it still builds on the GNU toolchain without native deps.
resvg = "0.44"
# The `render --pdf` path packs the same rasters into one PDF; flate2 (the
# same crate zip already brings in) compresses the image streams, and the
# `png` crate (already in through resvg) decodes the rasters back to pixels.
# Both are zero-cost additions to the graph.
flate2 = "1"
png = "0.17"

# Keep the dependency graph honest and the test suite fast.

[profile.release]
lto = true
strip = true
